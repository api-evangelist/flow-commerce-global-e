aid: flow-commerce-global-e
name: Flow Commerce (Global E)
description: >-
  Flow Commerce (now part of Global-e) is a cross-border ecommerce platform that lets online
  merchants localize the entire international shopping experience. It provides localized pricing in
  100+ currencies, localized checkout with international payment methods, guaranteed landed-cost
  (duties and taxes) calculation, international shipping and returns, fraud and compliance handling,
  and localized product feeds. Flow exposes these capabilities as a REST API defined in APIBuilder,
  with first-party Ruby and Node.js client SDKs generated from that service definition. Flow.io was
  acquired by Global-e and now operates as part of the Global-e cross-border enablement platform.
